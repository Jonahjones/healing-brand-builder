[build]
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist"

# Static file serving (must come before SPA fallback)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_FLAGS = "--legacy-peer-deps"

# Form handling configuration
[[forms]]
  name = "contact"
  
  # Email notifications
  [forms.settings]
    recipients = ["zach@resilientmindcounseling.info"]